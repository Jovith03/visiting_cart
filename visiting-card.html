<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card AI - Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 30px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #result {
            margin-top: 30px;
            text-align: left;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 12px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .value {
            font-weight: 600;
            color: var(--accent);
        }

        .loader {
            display: none;
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .raw-text {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #cbd5e1;
            font-size: 0.9rem;
            border-left: 3px solid var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Card Scanner AI</h1>
        <p>Upload a business card to extract info automatically</p>

        <form id="uploadForm">
            <div class="upload-area">
                <div id="fileName">Drop image here or click to browse</div>
                <input type="file" name="card" id="cardInput" accept="image/*" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Process Card</button>
        </form>

        <div class="loader" id="loader"></div>

        <div id="result">
            <h3 style="margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                Extracted Data</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const input = document.getElementById('cardInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        input.onchange = () => {
            if (input.files.length > 0) {
                fileName.innerText = input.files[0].name;
                fileName.style.color = '#10b981';
            }
        };

        form.onsubmit = async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            loader.style.display = 'block';
            result.style.display = 'none';

            if (!input.files || input.files.length === 0) {
                alert('Please select a business card image first.');
                submitBtn.disabled = false;
                loader.style.display = 'none';
                return;
            }

            const formData = new FormData();
            formData.append('card', input.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:3000/upload', {
                    method: 'POST',
                    body: formData
                });


                const data = await response.json();

                if (response.ok) {
                    resultContent.innerHTML = `
                        <div style="margin-top: 10px; font-weight: 600; font-size: 1rem; color: var(--accent); margin-bottom: 15px;">AI RECONSTRUCTED TEXT:</div>
                        <div class="raw-text" style="font-size: 1.1rem; line-height: 1.6; color: #fff;">${data.extracted_text || 'No text extracted.'}</div>
                        <div style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">Job ID: #${data.JobID}</div>
                    `;
                    result.style.display = 'block';
                } else {
                    alert('Error: ' + data.details);
                }
            } catch (error) {
                console.error(error);
                alert('Could not connect to the server. Make sure node Untitled-1.js is running.');
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        };
    </script>
</body>

</html>
